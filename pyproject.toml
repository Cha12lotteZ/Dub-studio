[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dubstudio"
version = "0.2.0"
description = "Dub videos and games with your own voice: character, mood and atmosphere effects, Thai TTS, transcription and voice models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pedalboard>=0.9.10",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.0",
  "demucs>=4.0",
  "transformers>=4.40",
  "torch>=2.2",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dubstudio = "dubstudio.cli:main"

[tool.setuptools]
packages = ["dubstudio"]

[tool.setuptools.package-data]
dubstudio = ["web/*"]
