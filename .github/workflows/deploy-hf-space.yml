# Copies the app to a Hugging Face Space, creating the Space (private, Docker)
# the first time. Run it by hand from the Actions tab. Docker Spaces need a
# Hugging Face PRO subscription (free accounts get "402 Payment Required").
# Setup (once), in GitHub: Settings -> Secrets and variables -> Actions
#   secret   HF_TOKEN      a Hugging Face "Write" token
#   secret   DUB_PASSWORD  (optional) password the web page asks for
#   variable HF_SPACE      (optional) defaults to <your-hf-username>/dub-studio
name: Deploy to Hugging Face Space

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Skip when no token is set
        if: env.HF_TOKEN == ''
        run: echo "::notice::Skipping deploy. Add the HF_TOKEN repository secret to deploy to Hugging Face."
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.11"
      - name: Create the Space if needed and set its password
        if: env.HF_TOKEN != ''
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          DUB_PASSWORD: ${{ secrets.DUB_PASSWORD }}
        run: |
          pip install -q "huggingface_hub>=0.24"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ.get("HF_SPACE") or f"{api.whoami()['name']}/dub-studio"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"HF_SPACE={space}\n")
          api.create_repo(space, repo_type="space", space_sdk="docker", private=True, exist_ok=True)
          if os.environ.get("DUB_PASSWORD"):
              api.add_space_secret(space, "DUB_PASSWORD", os.environ["DUB_PASSWORD"])
          print("Space ready:", f"https://huggingface.co/spaces/{space}")
          PY
      - name: Push the app to the Space
        if: env.HF_TOKEN != ''
        run: |
          set -euo pipefail
          HF_USER="${HF_SPACE%%/*}"
          git clone "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space
          # Replace the Space contents with this commit (the Space's README carries its config).
          find space -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive HEAD | tar -x -C space
          rm -rf space/.github
          cp deploy/hf-space/README.md space/README.md
          cd space
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push origin HEAD
